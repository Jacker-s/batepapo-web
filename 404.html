<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — BP Chat Anônimo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    body {
      background: #0d0814;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .box {
      max-width: 480px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 24px;
    }
    h1 { font-size: 32px; margin-bottom: 12px; }
    p { color: rgba(255, 255, 255, 0.7); margin-bottom: 24px; font-size: 15px; }
    .btn {
      display: inline-block;
      background: #ff2a68;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      margin: 6px;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
  </style>
  <script>
    // Smart redirect to clean URLs without .html
    const path = window.location.pathname.toLowerCase();
    if (path.includes('delete') || path.includes('excluir')) {
      window.location.replace('/delete-account');
    } else if (path.includes('privacy') || path.includes('privacidade')) {
      window.location.replace('/privacy');
    } else if (path.includes('download')) {
      window.location.replace('/download');
    } else if (path.includes('landing')) {
      window.location.replace('/landing');
    } else if (path.endsWith('.html')) {
      window.location.replace(path.replace(/\.html$/, ''));
    }
  </script>
</head>
<body>
  <div class="box">
    <h1>BP Chat Anônimo</h1>
    <p>A página que você procura foi movida ou não está disponível.</p>
    <a href="/" class="btn">Página Inicial</a>
    <a href="/delete-account" class="btn btn-secondary">Exclusão de Conta</a>
    <a href="/privacy" class="btn btn-secondary">Privacidade</a>
  </div>
</body>
</html>
